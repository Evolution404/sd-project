name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering:
    name: Engineering and Schema113
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: python3 scripts/check-public-source.py
      - uses: ./.github/actions/setup
      - run: pnpm run check
      - run: pnpm run check:schema
      - run: pnpm run test:performance
      - run: pnpm audit --registry=https://registry.npmjs.org --audit-level=moderate
