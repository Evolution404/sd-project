name: Release candidate
on:
  push:
    tags: ['v1.0.0-rc.*']

permissions:
  contents: read
  checks: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Same-commit gate and candidate ZIPs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify main and successful checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" --jq '.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success") | .name' > "$RUNNER_TEMP/valid-checks"
          for job in 'Engineering and Schema113' 'Browser (production)' 'Browser (legacy)' 'Browser (worksheet-scale)' 'Browser (worksheet-layout)' 'Browser (worksheet-disposal)' 'Build and verify Windows ZIPs' 'Windows runtime and deployment'; do
            grep -Fxq "$job" "$RUNNER_TEMP/valid-checks" || { printf 'Missing successful check: %s\n' "$job"; exit 1; }
          done
      - run: python3 scripts/check-public-source.py
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium chrome
      - run: make release-final
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: candidate-${{ github.sha }}
          path: |
            dist/sd-project-win10-x64.zip
            dist/sd-project-win10-x64-demo.zip
            dist/RELEASE-MANIFEST.json
            dist/DEMO-RELEASE-MANIFEST.json
            dist/FINAL-DELIVERY-REPORT.md
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish GitHub prerelease
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-${{ github.sha }}
          path: candidate
      - name: Publish verified synthetic demo and data-free Windows program
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" candidate/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes-file candidate/FINAL-DELIVERY-REPORT.md
