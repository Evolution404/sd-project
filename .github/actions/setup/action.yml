name: Set up the project toolchain
description: Install the pinned Node.js and pnpm versions and frozen workspace dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '24.22.3'
        package-manager-cache: false
    - uses: pnpm/action-setup@26f6d4f2c533a43e6b5da0b4a5dd983f98f7b49a # v6.0.4
      with:
        version: '10.34.5'
        run_install: false
    - shell: bash
      run: |
        test "$(node --version)" = v24.22.3
        test "$(pnpm --version)" = 10.34.5
        pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
